<div class="grid grid-cols-12 sm:grid-cols-12 md:grid-cols-12 lg:grid-cols-12 pt-[100px]">
    <h1 class="col-span-12 flex justify-center items-center font-bold">Education</h1>
    <div class="col-span-12 flex justify-center">
        <div class="card cardEducate">

            <div class="flex justify-start font-bold">
                <h3 class="mr-3">{{education.sinceDate}}</h3>
                <h3>{{education.level}}</h3>
            </div>
            <li class="mt-3">{{education.university}}</li>
            <li class="mt-2">{{education.faculty}}</li>
            <li class="mt-2">GPA: 2.60</li>
        </div>
    </div>
    
</div>
