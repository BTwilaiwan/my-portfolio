<div class="grid grid-cols-12 sm:grid-cols-12 md:grid-cols-12 lg:grid-cols-12 pt-[100px]">
    <h1 class="col-span-12 flex justify-center items-center font-bold mb-2">Experience</h1>
    <ng-container *ngFor="let item of experience">
        <div class="col-span-12 card">
            <div class="flex justify-start">
                <img src="{{item.image}}" alt="ptt-digital" width="{{item.width}}">
                <h2 class="flex justify-start font-bold items-center ml-3">{{item.companyName}}</h2>
            </div>
            <h3 class="mt-3 mb-3 font-bold">{{item.workDate}}</h3>
            <ng-container *ngFor="let desc of item.descList">
                <li class="mt-2">{{desc.description}}</li>
            </ng-container>
        </div>
    </ng-container>
</div>
